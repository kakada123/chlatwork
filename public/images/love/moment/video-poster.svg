<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Our video memory</title>
  <desc id="description">A pink video cover with hearts and a play button.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1c23"/>
      <stop offset="1" stop-color="#51303d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#160b10" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <g fill="#ff7199" opacity=".18">
    <path d="M110 142c-40-43-112 15 0 93 112-78 40-136 0-93z"/>
    <path d="M1060 470c-48-51-134 18 0 111 134-93 48-162 0-111z"/>
    <path d="M935 92c-25-27-70 9 0 58 70-49 25-85 0-58z"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="600" cy="307" r="102" fill="#fff7f3"/>
    <path d="M574 253l84 54-84 54z" fill="#ff477e"/>
  </g>
  <text x="600" y="458" fill="#fff7f3" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Tap to play our memory</text>
  <text x="600" y="507" fill="#ffc4d4" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">a little moment worth replaying ♥</text>
</svg>
