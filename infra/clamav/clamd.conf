User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
FixStaleSocket yes

# Railway uses IPv6 private networking; Docker localhost can use IPv4.
# This service must have no public domain or TCP proxy.
TCPSocket 3310
TCPAddr 0.0.0.0
TCPAddr ::
EnableShutdownCommand no

LogFile /var/log/clamav/clamd.log
LogFileMaxSize 1M
LogTime yes
LogClean no
LogVerbose no
ExtendedDetectionInfo no
GenerateMetadataJson no
LeaveTemporaryFiles no
TemporaryDirectory /tmp

MaxThreads 2
MaxQueue 8
MaxConnectionQueueLength 10
CommandReadTimeout 10
ReadTimeout 15
SendBufTimeout 500
StreamMaxLength 20M
MaxFileSize 20M
MaxScanSize 50M
MaxScanTime 10000
MaxRecursion 8
MaxFiles 100

# Expose incomplete/encrypted scans as heuristic findings so the API preserves them.
AlertExceedsMax yes
AlertEncrypted yes
OfficialDatabaseOnly yes
SelfCheck 600
FailIfCvdOlderThan 7
# Avoid holding two signature engines in RAM during updates; API timeouts preserve files.
ConcurrentDatabaseReload no
